<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mentor Data Analyst</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg:#1B2420;
    --panel:#212B26;
    --panel-raised:#26312B;
    --ink:#EDEAE0;
    --ink-dim:#9FA89F;
    --gold:#C9A227;
    --teal:#6FA096;
    --brick:#C06A4E;
    --sage:#8CB06A;
    --border:#3A453F;
    --border-soft:#2E3833;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  .font-display{font-family:'Fraunces',serif;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}
  ::selection{background:var(--gold);color:#1B2420;}
  .page-margin{border-left:2px solid var(--border);}
  .scrollbar-thin::-webkit-scrollbar{width:6px;}
  .scrollbar-thin::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  @keyframes riseIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .rise{animation:riseIn .35s ease both;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

// ---------- backend proxy (la clé Mistral reste côté serveur) ----------
async function askAgent(system, user) {
  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ system, user }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Erreur inconnue");
  return data.content;
}

function parseJSON(text) {
  const cleaned = (text || "").replace(/```json/g, "").replace(/```/g, "").trim();
  try { return JSON.parse(cleaned); }
  catch {
    const match = cleaned.match(/\{[\s\S]*\}|\[[\s\S]*\]/);
    if (match) { try { return JSON.parse(match[0]); } catch {} }
    return null;
  }
}

// ---------- persistance utilisateur ----------
function useUserId() {
  const [userId, setUserId] = useState(() => {
    let id = localStorage.getItem("mda_user_id");
    if (!id) {
      id = "mda_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
      localStorage.setItem("mda_user_id", id);
    }
    return id;
  });
  const restore = (id) => { localStorage.setItem("mda_user_id", id); setUserId(id); window.location.reload(); };
  return [userId, restore];
}

async function loadData(userId) {
  const res = await fetch(`/api/data/${userId}`);
  const json = await res.json();
  return json.data || {};
}
async function saveData(userId, data) {
  await fetch(`/api/data/${userId}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ data }),
  });
}

const TOPICS = [
  "Fondations de l'analyse de données",
  "Nettoyage et préparation des données",
  "SQL pour l'analyse",
  "Analyse statistique",
  "Visualisation de données (Tableau / Looker)",
  "R ou Python pour la data",
  "Storytelling avec la donnée",
  "Étude de cas / capstone"
];

// ================= Tab: Révision =================
function RevisionTab({ userId, store, setStore }) {
  const [topic, setTopic] = useState(TOPICS[0]);
  const [quiz, setQuiz] = useState(null);
  const [answers, setAnswers] = useState({});
  const [revealed, setRevealed] = useState({});
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const scores = store.quizScores || [];

  const generateQuiz = async () => {
    setLoading(true); setError(""); setQuiz(null); setAnswers({}); setRevealed({});
    try {
      const system = "Tu es un formateur qui prépare des QCM pour un futur Data Analyst suivant le parcours Google Data Analytics Professional Certificate. Réponds UNIQUEMENT en JSON valide, sans texte autour, sans markdown.";
      const user = `Génère un quiz de 5 questions à choix multiples (4 options chacune, une seule correcte) sur le thème : "${topic}". Format JSON strict :
{"questions":[{"question":"...","options":["...","...","...","..."],"correctIndex":0,"explication":"..."}]}`;
      const raw = await askAgent(system, user);
      const parsed = parseJSON(raw);
      if (!parsed || !parsed.questions) throw new Error("Réponse inattendue, réessaie.");
      setQuiz(parsed.questions);
    } catch (e) { setError(e.message); }
    setLoading(false);
  };

  const choose = (qi, oi) => {
    if (revealed[qi]) return;
    setAnswers(a => ({ ...a, [qi]: oi }));
    setRevealed(r => ({ ...r, [qi]: true }));
  };

  useEffect(() => {
    if (!quiz) return;
    const allDone = quiz.every((_, i) => revealed[i]);
    if (allDone) {
      const correct = quiz.filter((q, i) => answers[i] === q.correctIndex).length;
      const entry = { topic, correct, total: quiz.length, date: new Date().toISOString() };
      const next = { ...store, quizScores: [entry, ...scores].slice(0, 20) };
      setStore(next); saveData(userId, next);
    }
    // eslint-disable-next-line
  }, [revealed]);

  return (
    <div className="rise">
      <p className="text-[15px] leading-relaxed mb-6" style={{color:"var(--ink-dim)"}}>
        Choisis une notion du parcours, génère un quiz de 5 questions et vérifie ce qui est acquis.
      </p>
      <div className="flex flex-wrap gap-2 mb-6">
        {TOPICS.map(t => (
          <button key={t} onClick={() => setTopic(t)}
            className="px-3 py-1.5 text-[13px] rounded-sm border transition-colors"
            style={{
              borderColor: topic===t ? "var(--gold)" : "var(--border)",
              color: topic===t ? "var(--gold)" : "var(--ink-dim)",
              background: topic===t ? "rgba(201,162,39,0.08)" : "transparent"
            }}>{t}</button>
        ))}
      </div>
      <button onClick={generateQuiz} disabled={loading}
        className="px-5 py-2.5 rounded-sm font-mono text-[13px] mb-8"
        style={{background:"var(--gold)", color:"#1B2420", opacity: loading?0.6:1}}>
        {loading ? "Génération…" : "Générer un quiz sur ce thème"}
      </button>

      {error && <p className="mb-6 text-[14px]" style={{color:"var(--brick)"}}>{error}</p>}

      {quiz && (
        <div className="space-y-5 mb-10">
          {quiz.map((q, qi) => (
            <div key={qi} className="p-5 rounded-sm border" style={{borderColor:"var(--border)", background:"var(--panel)"}}>
              <p className="font-display text-[17px] mb-4">{qi+1}. {q.question}</p>
              <div className="space-y-2">
                {q.options.map((opt, oi) => {
                  const isChosen = answers[qi] === oi;
                  const isCorrect = q.correctIndex === oi;
                  const show = revealed[qi];
                  let border = "var(--border-soft)", color = "var(--ink)";
                  if (show && isCorrect) { border = "var(--sage)"; color = "var(--sage)"; }
                  else if (show && isChosen && !isCorrect) { border = "var(--brick)"; color = "var(--brick)"; }
                  return (
                    <button key={oi} onClick={() => choose(qi, oi)}
                      className="block w-full text-left px-4 py-2.5 rounded-sm border text-[14px]"
                      style={{borderColor: border, color: color}}>
                      {opt}
                    </button>
                  );
                })}
              </div>
              {revealed[qi] && (
                <p className="mt-3 text-[13px] font-mono" style={{color:"var(--ink-dim)"}}>{q.explication}</p>
              )}
            </div>
          ))}
        </div>
      )}

      {scores.length > 0 && (
        <div>
          <p className="font-display text-[16px] mb-3">Historique</p>
          <div className="space-y-1.5 font-mono text-[13px]" style={{color:"var(--ink-dim)"}}>
            {scores.map((s, i) => (
              <div key={i} className="flex justify-between border-b py-1.5" style={{borderColor:"var(--border-soft)"}}>
                <span>{s.topic}</span>
                <span style={{color: s.correct/s.total >= 0.8 ? "var(--sage)" : "var(--gold)"}}>{s.correct}/{s.total}</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ================= Tab: Projets pilotes =================
function ProjectsTab({ userId, store, setStore }) {
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [difficulty, setDifficulty] = useState("Débutant");
  const projects = store.pilotProjects || [];

  const generateProject = async () => {
    setLoading(true); setError("");
    try {
      const system = "Tu conçois des mini-projets pilotes concrets pour un futur Data Analyst en formation, avec des jeux de données réels et accessibles publiquement. Réponds UNIQUEMENT en JSON valide, sans texte autour, sans markdown.";
      const user = `Propose un projet pilote de niveau "${difficulty}", différent des projets déjà proposés (${projects.map(p=>p.titre).join(", ") || "aucun"}). Format JSON strict :
{"titre":"...","contexte":"2-3 phrases sur la situation métier simulée","jeu_de_donnees":"nom + source publique concrète (ex: Kaggle, data.gouv.fr) pour trouver ce type de données","objectifs":["...","..."],"etapes":["...","...","...","...","..."],"livrable":"...","competences":["...","..."]}`;
      const raw = await askAgent(system, user);
      const parsed = parseJSON(raw);
      if (!parsed || !parsed.titre) throw new Error("Réponse inattendue, réessaie.");
      const project = { ...parsed, id: Date.now(), difficulty, doneSteps: [] };
      const next = { ...store, pilotProjects: [project, ...projects] };
      setStore(next); saveData(userId, next);
    } catch (e) { setError(e.message); }
    setLoading(false);
  };

  const toggleStep = (projectId, stepIdx) => {
    const next = {
      ...store,
      pilotProjects: projects.map(p => {
        if (p.id !== projectId) return p;
        const has = p.doneSteps.includes(stepIdx);
        return { ...p, doneSteps: has ? p.doneSteps.filter(s => s !== stepIdx) : [...p.doneSteps, stepIdx] };
      })
    };
    setStore(next); saveData(userId, next);
  };

  return (
    <div className="rise">
      <p className="text-[15px] leading-relaxed mb-6" style={{color:"var(--ink-dim)"}}>
        Un projet pilote te donne un contexte métier, un jeu de données à trouver toi-même et des étapes guidées — exactement comme un vrai mandat.
      </p>
      <div className="flex items-center gap-3 mb-8">
        <select value={difficulty} onChange={e => setDifficulty(e.target.value)}
          className="px-3 py-2 rounded-sm border font-mono text-[13px]"
          style={{background:"var(--panel)", borderColor:"var(--border)", color:"var(--ink)"}}>
          <option>Débutant</option>
          <option>Intermédiaire</option>
          <option>Avancé</option>
        </select>
        <button onClick={generateProject} disabled={loading}
          className="px-5 py-2.5 rounded-sm font-mono text-[13px]"
          style={{background:"var(--teal)", color:"#12211D", opacity: loading?0.6:1}}>
          {loading ? "Génération…" : "Nouveau projet pilote"}
        </button>
      </div>

      {error && <p className="mb-6 text-[14px]" style={{color:"var(--brick)"}}>{error}</p>}

      <div className="space-y-6">
        {projects.map(p => (
          <div key={p.id} className="p-6 rounded-sm border" style={{borderColor:"var(--border)", background:"var(--panel)"}}>
            <div className="flex items-center justify-between mb-2">
              <p className="font-display text-[19px]">{p.titre}</p>
              <span className="font-mono text-[11px] px-2 py-1 rounded-sm" style={{color:"var(--ink-dim)", border:"1px solid var(--border-soft)"}}>{p.difficulty}</span>
            </div>
            <p className="text-[14px] mb-4" style={{color:"var(--ink-dim)"}}>{p.contexte}</p>

            <p className="font-mono text-[12px] mb-1" style={{color:"var(--gold)"}}>Jeu de données</p>
            <p className="text-[14px] mb-4">{p.jeu_de_donnees}</p>

            <p className="font-mono text-[12px] mb-1" style={{color:"var(--gold)"}}>Objectifs</p>
            <ul className="text-[14px] mb-4 list-disc pl-5 space-y-1">
              {p.objectifs.map((o,i) => <li key={i}>{o}</li>)}
            </ul>

            <p className="font-mono text-[12px] mb-2" style={{color:"var(--gold)"}}>Étapes</p>
            <div className="space-y-2 mb-4">
              {p.etapes.map((step, i) => {
                const done = p.doneSteps.includes(i);
                return (
                  <label key={i} className="flex items-start gap-3 text-[14px] cursor-pointer">
                    <input type="checkbox" checked={done} onChange={() => toggleStep(p.id, i)} className="mt-1" />
                    <span style={{ textDecoration: done ? "line-through" : "none", color: done ? "var(--ink-dim)" : "var(--ink)" }}>
                      {i+1}. {step}
                    </span>
                  </label>
                );
              })}
            </div>

            <p className="font-mono text-[12px] mb-1" style={{color:"var(--gold)"}}>Livrable attendu</p>
            <p className="text-[14px] mb-4">{p.livrable}</p>

            <div className="flex flex-wrap gap-2">
              {p.competences.map((c,i) => (
                <span key={i} className="font-mono text-[11px] px-2 py-1 rounded-sm" style={{border:"1px solid var(--border-soft)", color:"var(--teal)"}}>{c}</span>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ================= Tab: Mindset =================
function MindsetTab({ userId, store, setStore }) {
  const [messages, setMessages] = useState(store.mindsetChat || []);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const scrollRef = useRef(null);

  useEffect(() => { scrollRef.current?.scrollTo(0, scrollRef.current.scrollHeight); }, [messages]);

  const send = async () => {
    if (!input.trim() || loading) return;
    const userMsg = { role: "user", content: input.trim() };
    const nextMessages = [...messages, userMsg];
    setMessages(nextMessages);
    setInput("");
    setLoading(true);
    try {
      const system = `Tu es un mentor expérimenté qui coache un futur Data Analyst sur le mindset du métier : curiosité rigoureuse, structuration d'hypothèses, tolérance à l'ambiguïté, communication avec des non-techniques, sens du business, esprit critique face aux données. Réponds en français, de façon directe et concrète, avec des exemples courts. Pas de listes à puces systématiques — écris comme un mentor qui parle vraiment.`;
      const history = nextMessages.slice(-8).map(m => `${m.role === "user" ? "Élève" : "Mentor"}: ${m.content}`).join("\n");
      const reply = await askAgent(system, history);
      const finalMessages = [...nextMessages, { role: "assistant", content: reply }];
      setMessages(finalMessages);
      const next = { ...store, mindsetChat: finalMessages.slice(-30) };
      setStore(next); saveData(userId, next);
    } catch (e) {
      setMessages(m => [...m, { role: "assistant", content: "Erreur : " + e.message }]);
    }
    setLoading(false);
  };

  const starters = [
    "Comment je sais si une corrélation que je trouve est vraiment intéressante ?",
    "Un manager me demande un chiffre impossible à obtenir proprement, je fais quoi ?",
    "Comment structurer mes hypothèses avant même d'ouvrir les données ?"
  ];

  return (
    <div className="rise flex flex-col" style={{height:"65vh"}}>
      {messages.length === 0 && (
        <div className="mb-4 flex flex-wrap gap-2">
          {starters.map((s,i) => (
            <button key={i} onClick={() => setInput(s)}
              className="text-left px-3 py-2 text-[13px] rounded-sm border"
              style={{borderColor:"var(--border)", color:"var(--ink-dim)"}}>{s}</button>
          ))}
        </div>
      )}
      <div ref={scrollRef} className="flex-1 overflow-y-auto scrollbar-thin space-y-4 pr-2 mb-4">
        {messages.map((m, i) => (
          <div key={i} className="max-w-[85%]" style={{marginLeft: m.role==="user" ? "auto" : 0}}>
            <p className="font-mono text-[11px] mb-1" style={{color:"var(--ink-dim)"}}>{m.role === "user" ? "Toi" : "Mentor"}</p>
            <div className="px-4 py-3 rounded-sm text-[14px] leading-relaxed"
              style={{
                background: m.role === "user" ? "var(--panel-raised)" : "var(--panel)",
                border: "1px solid " + (m.role === "user" ? "var(--border)" : "var(--border-soft)")
              }}>
              {m.content}
            </div>
          </div>
        ))}
        {loading && <p className="font-mono text-[12px]" style={{color:"var(--ink-dim)"}}>Le mentor réfléchit…</p>}
      </div>
      <div className="flex gap-2">
        <input value={input} onChange={e => setInput(e.target.value)}
          onKeyDown={e => e.key === "Enter" && send()}
          placeholder="Pose une question sur le métier, une situation, un doute…"
          className="flex-1 px-4 py-3 rounded-sm border text-[14px]"
          style={{background:"var(--panel)", borderColor:"var(--border)", color:"var(--ink)"}} />
        <button onClick={send} disabled={loading}
          className="px-5 rounded-sm font-mono text-[13px]"
          style={{background:"var(--gold)", color:"#1B2420", opacity: loading?0.6:1}}>Envoyer</button>
      </div>
    </div>
  );
}

// ================= App =================
function App() {
  const [userId, restoreUserId] = useUserId();
  const [store, setStore] = useState({});
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState("revision");
  const [restoreInput, setRestoreInput] = useState("");
  const [showRestore, setShowRestore] = useState(false);

  useEffect(() => {
    let settled = false;
    // Filet de sécurité : si la base de données met trop de temps à répondre
    // (ex: réveil après inactivité), on affiche quand même l'appli après 6s
    // plutôt que de rester bloqué sur un écran noir indéfiniment.
    const safety = setTimeout(() => {
      if (!settled) { settled = true; setStore({}); setReady(true); }
    }, 6000);
    loadData(userId)
      .then(d => { if (!settled) { settled = true; clearTimeout(safety); setStore(d); setReady(true); } })
      .catch(() => { if (!settled) { settled = true; clearTimeout(safety); setStore({}); setReady(true); } });
    return () => clearTimeout(safety);
  }, [userId]);

  const tabs = [
    { id: "revision", label: "Réviser" },
    { id: "projets", label: "Projets pilotes" },
    { id: "mindset", label: "Mindset" }
  ];

  if (!ready) return (
    <div style={{background:"var(--bg)", minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center"}}>
      <p className="font-mono text-[13px]" style={{color:"var(--ink-dim)"}}>Chargement…</p>
    </div>
  );

  return (
    <div style={{ minHeight: "100vh", background: "var(--bg)" }}>
      <div className="max-w-[820px] mx-auto px-6 pt-14 pb-24">
        <header className="mb-10">
          <p className="font-mono text-[12px] mb-2" style={{color:"var(--teal)"}}>Carnet d'entraînement</p>
          <h1 className="font-display text-[32px] leading-tight mb-3">Mentor Data Analyst</h1>
          <p className="text-[15px]" style={{color:"var(--ink-dim)"}}>Réviser les notions, s'exercer sur de vrais projets, et penser comme un analyste.</p>
        </header>

        <nav className="flex gap-1 mb-10 border-b" style={{borderColor:"var(--border)"}}>
          {tabs.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)}
              className="px-4 py-3 font-mono text-[13px] -mb-px border-b-2"
              style={{
                borderColor: tab===t.id ? "var(--gold)" : "transparent",
                color: tab===t.id ? "var(--ink)" : "var(--ink-dim)"
              }}>{t.label}</button>
          ))}
        </nav>

        <main className="page-margin pl-6">
          {tab === "revision" && <RevisionTab userId={userId} store={store} setStore={setStore} />}
          {tab === "projets" && <ProjectsTab userId={userId} store={store} setStore={setStore} />}
          {tab === "mindset" && <MindsetTab userId={userId} store={store} setStore={setStore} />}
        </main>

        <footer className="mt-16 pt-6 border-t font-mono text-[11px]" style={{borderColor:"var(--border-soft)", color:"var(--ink-dim)"}}>
          <p className="mb-2">Identifiant : {userId}</p>
          {!showRestore ? (
            <button onClick={() => setShowRestore(true)} className="underline">Restaurer depuis un identifiant</button>
          ) : (
            <div className="flex gap-2 mt-2">
              <input value={restoreInput} onChange={e => setRestoreInput(e.target.value)}
                placeholder="mda_xxxxxxxx"
                className="px-3 py-2 rounded-sm border font-mono text-[12px]"
                style={{background:"var(--panel)", borderColor:"var(--border)", color:"var(--ink)"}} />
              <button onClick={() => restoreUserId(restoreInput.trim())} className="px-3 py-2 rounded-sm" style={{background:"var(--gold)", color:"#1B2420"}}>Restaurer</button>
            </div>
          )}
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
